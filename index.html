<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,500&family=JetBrains+Mono:wght@500;700&display=swap">
<meta name="theme-color" content="#0B1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Trips">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: one-column phone app on a midnight-navy ground; every panel is a neon-outlined card whose color (--c)
   comes from its tab, its day, or its bag. Single dark look on purpose, to match the family's game-night cards. */
:root{
  --bg:#0B1030; --surface:#151C4A; --sunk:#10163C; --ink:#F3F5FF; --muted:#A4ACDB; --line:#2E3878;
  --cyan:#22E4F5; --lime:#B8F23C; --yellow:#FFE234; --pink:#FF3DAE; --purple:#B57BFF; --orange:#FF9A3C;
  --on-neon:#0B1030; --done:#B8F23C; --warn:#FF9A3C;
  --k0:var(--cyan); --k1:var(--lime); --k2:var(--yellow); --k3:var(--pink); --k4:var(--purple); --k5:var(--orange);
  --bag-wear:var(--pink); --bag-personal:var(--cyan); --bag-carryon:var(--yellow); --bag-checked:var(--purple); --bag-car:var(--lime);
  --c:var(--cyan);
  --f-display:"Poppins", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Poppins", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;font-weight:500;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.12}
h2{font-weight:800}
.muted{color:var(--muted)}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}

/* Neon card: the one card style, colored by --c */
.neon,.pass,.panel,.q,.day,.cat,.emptystate,.weekwrap,.sheet{
  background:var(--surface);border:2.5px solid var(--c);border-radius:var(--r);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent), 0 0 22px -6px color-mix(in srgb, var(--c) 75%, transparent), inset 0 0 18px -12px var(--c)}
.panel h3,.q h3,.cat h4{color:var(--c);text-transform:uppercase;letter-spacing:.02em;font-weight:800}

/* Header: boarding pass with a row of travel icons */
.pass{--c:var(--cyan);overflow:hidden}
.pass-top{padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px}
.pass-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pass h1{font-size:clamp(30px,8vw,46px);font-weight:800;letter-spacing:-.02em;color:var(--cyan);text-shadow:0 0 18px color-mix(in srgb, var(--cyan) 45%, transparent)}
.route{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.suits{display:inline-flex;gap:6px;font-size:18px}
.suits .ic{width:1em;height:1em;stroke-width:2.4}
.pass-stub{border-top:2.5px dashed var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;padding:12px 18px 14px;background:var(--sunk)}
.stub-lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;display:flex;gap:5px;align-items:center}
.stub-val{font-weight:700;font-size:14px;min-width:0;overflow-wrap:anywhere}
.status{font-family:var(--f-mono);font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--yellow);color:var(--on-neon);white-space:nowrap;box-shadow:0 0 14px -2px color-mix(in srgb, var(--yellow) 60%, transparent)}
.status.now{background:var(--lime);box-shadow:0 0 14px -2px color-mix(in srgb, var(--lime) 60%, transparent)}
.status.past{background:var(--sunk);color:var(--muted);box-shadow:none}
.tripsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tripsel select{background:var(--sunk);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;max-width:100%}

/* Tabs: icon over label, each tab its own neon */
.tabs{display:flex;gap:4px;background:var(--sunk);border:1.5px solid var(--line);border-radius:18px;padding:5px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;padding:7px 6px 6px;border-radius:13px;font-weight:700;font-size:12.5px;color:var(--muted);white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px}
.tab .ic{width:22px;height:22px;color:var(--tc)}
.tab[aria-selected="true"]{background:var(--tc);color:var(--on-neon);box-shadow:0 0 16px -2px color-mix(in srgb, var(--tc) 70%, transparent)}
.tab[aria-selected="true"] .ic{color:var(--on-neon)}
#tab-summary{--tc:var(--cyan)} #tab-schedule{--tc:var(--lime)} #tab-outfits{--tc:var(--pink)} #tab-packing{--tc:var(--yellow)} #tab-setup{--tc:var(--purple)}
main[data-tab="summary"]{--c:var(--cyan)} main[data-tab="schedule"]{--c:var(--lime)} main[data-tab="outfits"]{--c:var(--pink)} main[data-tab="packing"]{--c:var(--yellow)} main[data-tab="setup"]{--c:var(--purple)}
main[data-tab="setup"] > .panel:nth-child(6n+2){--c:var(--cyan)} main[data-tab="setup"] > .panel:nth-child(6n+3){--c:var(--yellow)}
main[data-tab="setup"] > .panel:nth-child(6n+4){--c:var(--lime)} main[data-tab="setup"] > .panel:nth-child(6n+5){--c:var(--orange)}
main[data-tab="outfits"] > .panel + .panel{--c:var(--purple)}
.sec-title{font-size:24px;font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:.01em;display:flex;gap:8px;align-items:center}

/* Buttons */
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:2px solid var(--line);background:var(--sunk);border-radius:12px;padding:8px 13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--c)}
.btn.primary{background:var(--c);border-color:var(--c);color:var(--on-neon);box-shadow:0 0 16px -3px color-mix(in srgb, var(--c) 70%, transparent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{border-color:var(--line);color:var(--ink)}
.btn.danger{color:var(--orange);border-color:var(--orange);background:transparent}
.btn.small{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.linkbtn{border:0;background:none;color:var(--c);font-weight:700;padding:0}
.iconbtn{border:0;background:transparent;color:var(--muted);padding:4px 7px;border-radius:8px;font-size:13px;font-weight:700}
.iconbtn:hover{background:var(--sunk);color:var(--c)}
.iconbtn{white-space:nowrap}
.panel .choice + .choice{padding-top:6px;border-top:1.5px dashed var(--line)}

/* Days (summary and outfits) */
.days{display:flex;flex-direction:column;gap:14px}
.day{display:grid;grid-template-columns:66px 1fr;scroll-margin-top:96px}
.day.today{border-width:3.5px}
.day.tap{cursor:pointer}
.day.tap:hover{background:color-mix(in srgb, var(--c) 7%, var(--surface))}
.dstamp{border-right:2.5px dashed color-mix(in srgb, var(--c) 45%, var(--line));padding:14px 6px;text-align:center;display:flex;flex-direction:column;gap:1px;align-items:center}
.dstamp .dw{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--c)}
.dstamp .dd{font-weight:800;font-size:19px}
.dstamp .dd.big{font-size:28px;color:var(--c);line-height:1}
.dstamp .dn{font-size:11px;color:var(--muted);font-weight:600}
.dbody{padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:8px}
.dhead{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.dhead h3{font-size:19px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;border:1.5px solid var(--line)}
.chip.dress{background:transparent;color:var(--pink);border-color:var(--pink)}
.chip.today{background:var(--lime);color:var(--on-neon);border-color:var(--lime)}
.chip.warn{background:var(--yellow);color:var(--on-neon);border-color:var(--yellow)}
.events{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.ev{display:grid;grid-template-columns:78px 1fr auto;gap:10px;padding:9px 6px;border-top:1px solid var(--line);align-items:start}
.ev:first-child{border-top:0}
.ev .t{font-family:var(--f-mono);font-size:13px;font-weight:700;padding-top:2px;font-variant-numeric:tabular-nums;color:var(--c)}
.ev .what{min-width:0}
.ev .lab{font-weight:700}
.ev .notes{color:var(--muted);font-size:14px;font-weight:500;white-space:pre-line;overflow-wrap:anywhere}
.ev.tap{cursor:pointer;border-radius:10px}
.ev.tap:hover{background:var(--sunk)}
.ev.ph .lab{color:var(--muted);font-style:italic;font-weight:500}
.ev.ph .notes{font-style:italic;opacity:.8}
.etype{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--et,var(--muted));margin-right:7px;vertical-align:1px}
.etype .ic{width:15px;height:15px}
.flight{--et:var(--cyan)} .hotel{--et:var(--orange)} .ship{--et:var(--purple)} .dining{--et:var(--pink)} .activity{--et:var(--lime)} .travel{--et:var(--yellow)} .note-type{--et:var(--muted)}
.empty-day{color:var(--muted);font-size:14px;margin:0}
.ofgrid{display:grid;grid-template-columns:max-content 1fr;gap:5px 12px;margin:0}
.ofgrid dt{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c);padding-top:2px}
.ofgrid dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* Schedule grid */
.weekwrap{overflow-x:auto;padding:0}
.sgrid{display:grid;grid-template-columns:72px repeat(7,minmax(118px,1fr));min-width:900px}
.sg-corner,.sg-head{position:sticky;top:0;z-index:2;background:var(--sunk);border-bottom:2.5px solid var(--c);padding:8px;min-width:0}
.sg-corner{left:0;z-index:3;font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--c);display:flex;align-items:flex-end}
.sg-head{border:0;border-left:1px solid var(--line);border-bottom:2.5px solid var(--c);text-align:left;display:flex;flex-direction:column;gap:3px;align-items:flex-start;color:var(--ink)}
.sg-head.today{background:color-mix(in srgb, var(--c) 18%, var(--sunk))}
.sg-dow{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--c)}
.sg-loc{font-weight:800;font-size:13px;line-height:1.2;text-transform:uppercase;letter-spacing:.02em}
.sg-time{position:sticky;left:0;z-index:1;background:var(--surface);font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:4px 8px;border-top:1px dotted var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.sg-time.hr,.sg-cell.hr{border-top:1px solid var(--line)}
.sg-time.hr{color:var(--ink);font-weight:700}
.sg-cell{border-left:1px solid var(--line);border-top:1px dotted var(--line);min-height:26px;padding:2px 3px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sg-cell.today{background:color-mix(in srgb, var(--c) 8%, transparent)}
.sg-cell.wx,.sg-time.wx{border-top:2.5px solid var(--line);font-family:var(--f-mono);font-size:12px;font-weight:700;padding:6px 8px;color:var(--yellow)}
.sg-ev{border:0;border-left:4px solid var(--et,var(--lime));background:color-mix(in srgb, var(--et,var(--lime)) 16%, var(--sunk));color:var(--ink);text-align:left;font-size:12px;font-weight:600;line-height:1.25;padding:4px 6px;border-radius:5px;overflow-wrap:anywhere}
.sg-ev .mono{font-size:10px;color:var(--muted)}
.sg-ev.ph{background:transparent;border:1px dashed var(--line);border-left:4px solid var(--line);color:var(--muted);font-style:italic;font-weight:500}

/* People & packing */
.people{display:flex;gap:8px;flex-wrap:wrap}
.person{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 15px 5px 5px;text-align:left}
.person[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 16px -4px var(--c)}
.ring{width:36px;height:36px;flex:none}
.ring .bgc{stroke:var(--sunk)} .ring .fgc{stroke:var(--c)} .ring.full .fgc{stroke:var(--lime)}
.ring text{fill:var(--ink);font-family:var(--f-mono);font-size:10px;font-weight:700}
.person .pn{font-weight:800;line-height:1.1}
.person .pk{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.fchip[aria-pressed="true"]{background:var(--c);color:var(--on-neon);border-color:var(--c)}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.toggle input,.checks input{accent-color:var(--c)}
.bagblock{display:flex;flex-direction:column;gap:10px}
.bagtag{display:flex;align-items:center;gap:10px}
.bagtag .tagshape{position:relative;padding:6px 14px 6px 26px;border-radius:5px 12px 12px 5px;background:var(--bagc);color:var(--on-neon);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;gap:6px;align-items:center;box-shadow:0 0 16px -3px color-mix(in srgb, var(--bagc) 70%, transparent)}
.bagtag .tagshape::before{content:"";position:absolute;left:9px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--bg)}
.bagtag .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cat{--c:var(--bagc);padding:10px 12px;min-width:0;border-width:2px}
.cat h4{margin:0 0 4px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.cat h4 .mono{font-size:12px;color:var(--muted)}
.item{display:flex;align-items:center;gap:8px;padding:3px 0;min-width:0}
.item label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;padding:3px 0}
.item input[type=checkbox]{width:21px;height:21px;accent-color:var(--lime);flex:none;margin:0}
.item .nm{overflow-wrap:anywhere}
.item.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb, var(--lime) 60%, transparent)}
.item .x{border:0;background:transparent;color:var(--muted);font-size:17px;line-height:1;padding:4px 7px;border-radius:7px;opacity:.6}
.item .x:hover{opacity:1;background:var(--sunk);color:var(--orange)}
.mine{font-family:var(--f-mono);font-size:10px;color:var(--cyan);font-weight:700;margin-left:5px}
.qty{display:inline-block;margin-left:6px;font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--on-neon);background:var(--pink);border-radius:999px;padding:1px 8px;vertical-align:1px;white-space:nowrap}
.countlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px 14px}
.countrow{display:flex;gap:10px;align-items:flex-start;min-width:0}
.countn{flex:none;min-width:34px;height:34px;border-radius:10px;border:2px solid var(--c);color:var(--c);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0 6px}

/* Panels & forms */
.panel{padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-size:18px;display:flex;align-items:center;gap:8px}
.formrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 160px}
.field label,.flab{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea,.travrow input,.travrow select,.namerow input,.stepper input{background:var(--sunk);border:2px solid var(--line);border-radius:11px;padding:9px 11px;width:100%;min-width:0;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus,.travrow input:focus,.namerow input:focus,.stepper input:focus{border-color:var(--c);outline:none;box-shadow:0 0 12px -4px var(--c)}
.field textarea{min-height:76px;resize:vertical}
::placeholder{color:color-mix(in srgb, var(--muted) 70%, transparent)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;cursor:pointer;background:var(--sunk)}
.travrow{display:grid;grid-template-columns:1fr 120px auto;gap:8px;align-items:center}
.err{color:var(--orange);font-size:14px;font-weight:700}
.note{font-size:13px;color:var(--muted);font-weight:500}
.banner{background:color-mix(in srgb, var(--c) 14%, var(--sunk));border:1.5px solid color-mix(in srgb, var(--c) 60%, transparent);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.emptystate{padding:30px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;border-style:dashed}
.emptystate .big-ic{width:46px;height:46px;color:var(--c)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(3,6,22,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center;
  padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.sheet{--c:var(--cyan);color:var(--ink);width:100%;max-width:560px;border-radius:20px 20px 0 0;border-bottom:0;padding:18px max(16px, env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.sheet h3{color:var(--c);font-weight:800;font-size:20px}
@media (min-width:640px){ .scrim{align-items:center} .sheet{border-radius:20px;border-bottom:2.5px solid var(--c)} }
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--lime);color:var(--on-neon);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:0 0 22px -4px var(--lime)}

/* Trip builder */
.builder{display:flex;flex-direction:column;gap:18px}
.bhero{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.bhero h1{font-size:clamp(38px,11vw,60px);font-weight:800;letter-spacing:-.02em;color:var(--cyan);text-shadow:0 0 22px color-mix(in srgb, var(--cyan) 45%, transparent);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bhero p{margin:0;color:var(--muted);max-width:56ch;font-weight:600}
.q{padding:16px;display:flex;flex-direction:column;gap:12px}
.builder > .q:nth-of-type(6n+1){--c:var(--lime)} .builder > .q:nth-of-type(6n+2){--c:var(--cyan)} .builder > .q:nth-of-type(6n+3){--c:var(--yellow)}
.builder > .q:nth-of-type(6n+4){--c:var(--pink)} .builder > .q:nth-of-type(6n+5){--c:var(--purple)} .builder > .q:nth-of-type(6n+6){--c:var(--orange)}
.q h3{font-size:18px;display:flex;gap:10px;align-items:center}
.q h3 .qn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;background:var(--c);color:var(--on-neon);font-size:15px;font-weight:800}
.q h3 .note{text-transform:none;letter-spacing:0}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--sunk);border-radius:14px;padding:12px 14px;text-align:left;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;min-width:0}
.opt .ic{width:28px;height:28px;grid-row:span 2;color:var(--muted)}
.opt b{font-family:var(--f-display);font-size:17px;font-weight:800}
.opt span{font-size:12.5px;color:var(--muted);font-weight:500}
.opt[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb, var(--c) 14%, var(--sunk));box-shadow:0 0 16px -4px var(--c)}
.opt[aria-pressed="true"] b,.opt[aria-pressed="true"] .ic{color:var(--c)}
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper .btn{width:44px;height:44px;font-size:22px;padding:0;justify-content:center}
.stepper input{width:76px;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:22px;color:var(--c)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.namerow{display:flex;gap:6px}
.namerow input{flex:1}
.preview{border:2.5px dashed var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.preview > div:nth-child(1) .pv-n{color:var(--cyan)} .preview > div:nth-child(2) .pv-n{color:var(--yellow)}
.preview > div:nth-child(3) .pv-n{color:var(--pink)} .preview > div:nth-child(4) .pv-n{color:var(--lime)}
.preview .pv-n{font-family:var(--f-mono);font-size:22px;font-weight:700}
.preview .pv-l{font-size:13px;color:var(--muted)}

@media (max-width:520px){
  .ev{grid-template-columns:66px 1fr auto}
  .day{grid-template-columns:56px 1fr}
  .travrow{grid-template-columns:1fr 92px auto}
  .who{grid-template-columns:1fr}
}
@media (max-width:420px){ .tab{min-width:0;padding:6px 3px 5px;font-size:11.5px} .tab .ic{width:20px;height:20px} .choice{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

const ic = (name, cls) => `<svg class="ic${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;
const TYPE_ICON = {flight:'plane', hotel:'bed', ship:'ship', dining:'fork', travel:'car', activity:'star', note:'note'};
const BAG_ICON = {wear:'shirt', personal:'backpack', carryon:'briefcase', checked:'luggage', car:'car'};
const dayColor = n => `--c:var(--k${(n - 1) % 6})`;
const etypeTag = type => type && !['note','activity'].includes(type) ? `<span class="etype ${esc(type)}">${ic(TYPE_ICON[type] || 'star')}${esc(typeLabel(type))}</span>` : (type === 'activity' ? `<span class="etype activity">${ic('star')}</span>` : '');

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const clone = o => JSON.parse(JSON.stringify(o ?? null));
const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const parseISO = d => { const [y,m,dd] = String(d).split('-').map(Number); return new Date(Date.UTC(y, m-1, dd)); };
const iso = dt => dt.toISOString().slice(0,10);
const addDays = (d,n) => { const t = parseISO(d); t.setUTCDate(t.getUTCDate()+n); return iso(t); };
const daysBetween = (a,b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const validDate = d => /^\d{4}-\d{2}-\d{2}$/.test(d||'') && !isNaN(parseISO(d));
function todayISO(){ const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }
const dow = d => DOW[parseISO(d).getUTCDay()];
const fmtMD = d => { const t = parseISO(d); return `${t.getUTCMonth()+1}/${t.getUTCDate()}`; };
const fmtLong = d => { const t = parseISO(d); return `${MON[t.getUTCMonth()]} ${t.getUTCDate()}`; };
function fmtTime(t){ if(!t || !/^\d{1,2}:\d{2}$/.test(t)) return ''; const [h,m] = t.split(':').map(Number); return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`; }
function tagOk(cond, tags){ if(!cond) return true; return cond.split('+').every(c => c[0]==='!' ? !tags[c.slice(1)] : !!tags[c]); }

const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
function deepMerge(t, p){ for(const k of Object.keys(p)){ const v=p[k];
  if(v && typeof v==='object' && !Array.isArray(v) && t[k] && typeof t[k]==='object' && !Array.isArray(t[k])) deepMerge(t[k], v); else t[k] = clone(v); } return t; }
const clampNights = n => Math.max(0, Math.min(60, Math.round(Number(n) || 0)));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

/* Days are keyed "1".."N+1"; a start date is optional and only adds calendar dates. */
function dayList(t){
  const n = clampNights(t.nights) + 1, start = validDate(t.start) ? t.start : null;
  return Array.from({length:n}, (_,i) => ({n:i+1, key:String(i+1), date: start ? addDays(start, i) : null}));
}
function tripTypeLabel(tags){
  return [tags.cruise ? 'Cruise' : 'Land', tags.intl ? 'International' : 'Domestic', tags.disney ? 'Disney' : null].filter(Boolean).join(' · ');

function autoName(o){ return `${o.disney ? 'Disney ' : ''}${o.cruise ? 'cruise' : 'trip'} · ${plural(o.nights,'night')}`.replace(/^./, c => c.toUpperCase()); }

function ph(time, type, label, notes){ return {id:'e'+rid(), time, type, label, notes:notes || '', ph:true}; }
function genDays(o){
  const N = clampNights(o.nights), total = N + 1, days = {};
  const d = (n, title, events, dress) => { days[String(n)] = {title, weather:'', dress:dress || '', events}; };
  const fl = o.intl ? 'Airline & flight #, confirmation, seats · international: arrive 3 hrs early' : 'Airline & flight #, confirmation, seats';
  const landDay = n => o.disney
    ? d(n, 'Park day', [ph('08:00','activity','Park opening / rope drop','Park hours, ride reservations'), ph('12:00','dining','Lunch'), ph('15:00','activity','Afternoon break or rides'), ph('18:00','dining','Dinner'), ph('21:00','activity','Fireworks / evening show')])
    : d(n, 'Explore', [ph('09:00','activity','Morning plans'), ph('12:00','dining','Lunch'), ph('14:00','activity','Afternoon plans'), ph('18:00','dining','Dinner')]);
  if(total === 1){ d(1, 'Day trip', [ph('08:00','travel','Leave home'), ph('12:00','dining','Lunch'), ph('18:00','travel','Head home')]); return days; }
  if(!o.cruise){
    d(1, 'Travel day', [ph('09:00','travel','Leave for the airport'), ph('11:00','flight','Flight · depart', fl), ph('14:00','flight','Arrive'),
      ph('15:00','travel','Pick up rental car','Company, days, confirmation #'), ph('16:00','hotel','Check in · hotel', `${plural(N,'night')} · confirmation #`), ph('18:00','dining','Dinner')]);
    for(let n = 2; n < total; n++) landDay(n);
    d(total, 'Travel home', [ph('10:00','hotel','Check out'), ph('12:00','flight','Flight home', fl), ph('16:00','flight','Arrive home')]);
    return days;
  }
  let n = 1;
  if(N >= 3){
    d(1, 'Travel to the port city', [ph('09:00','travel','Leave for the airport'), ph('11:00','flight','Flight · depart', fl), ph('15:00','flight','Arrive'),
      ph('16:00','hotel','Check in · pre-cruise hotel','1 night · confirmation #'), ph('18:00','dining','Dinner')]);
    n = 2;
  }
  d(n, 'Embarkation day', [
    n === 1 ? ph('07:00','flight','Flight to the port city', fl) : ph('10:00','hotel','Check out · head to the port','Ask the hotel about a shuttle'),
    ph('12:00','ship','Board the ship','Cruise confirmation #, terminal address'), ph('16:00','ship','Ship departs'),
    ph('17:45','dining','Dinner', o.disney ? 'Rotational dining · check your dining time' : 'Check your dining time')], 'Casual');
  const sea = []; for(let k = n + 1; k < total; k++) sea.push(k);
  sea.forEach((k, i) => {
    let dress = 'Casual';
    if(sea.length >= 6 && i === sea.length - 2) dress = 'Semi-formal';
    if(o.disney && sea.length >= 3 && i === Math.floor(sea.length / 2)) dress = 'Pirate';
    if(i === 1) dress = 'Formal';
    d(k, 'Port or sea day', [ph('08:00','ship','Guests ashore','Port name and hours, or At Sea'), ph('16:30','ship','All aboard'), ph('17:45','dining','Dinner')], dress);
  });
  d(total, 'Debarkation day', [ph('08:00','ship','Debark'), ph('09:00','travel','Head to the airport'), ph('12:00','flight','Flight home', fl), ph('17:00','flight','Arrive home')]);
  return days;
}

/* ---------- storage: shared db, or this-device fallback ---------- */
function dbStore(db){
  const queues = {};
  const q = (path, fn) => { const p = (queues[path] || Promise.resolve()).catch(()=>{}).then(fn); queues[path] = p; return p; };
  return {
    kind:'db',
    watchTrips(cb, err){ return db.collection('trips').onSnapshot(s => { const o={}; s.docs.forEach(d => { if(d.exists) o[d.id] = d.data(); }); cb(o); }, err); },
    watchPacking(tripId, cb, err){ return db.collection('packing').where('tripId','==',tripId).onSnapshot(s => { const o={}; s.docs.forEach(d => { if(d.exists) o[d.id] = d.data(); }); cb(o); }, err); },
    setDoc:(path, body) => q(path, () => db.doc(path).set(body)),
    updateDoc:(path, patch) => q(path, () => db.doc(path).update(patch)),
    deleteDoc:(path) => q(path, () => db.doc(path).delete())
  };
}
function localStore(){
  const KEY = 'mctrips-local-v2';
  let data = {trips:{}, packing:{}};
  try { const r = lsGet(KEY); if(r) data = Object.assign(data, JSON.parse(r)); } catch(e){}
  const tripSubs = new Set(), packSubs = new Set();
  const emit = () => setTimeout(() => {
    tripSubs.forEach(cb => cb(clone(data.trips)));
    packSubs.forEach(s => { const o={}; for(const [k,v] of Object.entries(data.packing)) if(v.tripId===s.tid) o[k]=clone(v); s.cb(o); });
  }, 0);
  const save = () => { lsSet(KEY, JSON.stringify(data)); emit(); return Promise.resolve(); };
  const loc = path => { const [col,id] = path.split('/'); return [data[col], id]; };
  return {
    kind:'local',
    watchTrips(cb){ tripSubs.add(cb); emit(); return () => tripSubs.delete(cb); },
    watchPacking(tid, cb){ const s={tid,cb}; packSubs.add(s); emit(); return () => packSubs.delete(s); },
    setDoc(path, body){ const [c,id] = loc(path); c[id] = clone(body); return save(); },
    updateDoc(path, patch){ const [c,id] = loc(path); if(!c[id]) return Promise.reject({code:'invalid_argument'}); deepMerge(c[id], patch); return save(); },
    deleteDoc(path){ const [c,id] = loc(path); delete c[id]; return save(); }
  };
}

/* ---------- packing list builder ---------- */
function buildList(t, trav, opts){
  const tags = t.tags || {};
  const pk = (t.id && S.packing[pkId(t.id, trav.id)]) || {};
  const hidden = pk.hidden || {}, checked = pk.checked || {};
  const secs = [];
  for(const [who,bag,cat,cond,items] of TEMPLATE){
    if(who !== trav.kind || !tagOk(cond, tags)) continue;
    const list = [];
    for(const raw of items){ const [name, ic] = raw.split('|'); if(!tagOk(ic, tags)) continue;
      list.push({id:`${who}.${slug(cat)}.${slug(name)}`, name}); }
    if(list.length) secs.push({bag, cat, items:list});
  }
  for(const c of (pk.custom || [])){
    let s = secs.find(x => x.bag === c.bag && x.cat === c.cat);
    if(!s){ s = {bag:c.bag, cat:c.cat || 'My extras', items:[]}; secs.push(s); }
    s.items.push({id:c.id, name:c.name, custom:true});
  }
  if(!(opts && opts.noOutfit)){
    const counts = Array.isArray(pk.counts) ? pk.counts : [];
    const byId = {}; secs.forEach(s => s.items.forEach(i => byId[i.id] = i));
    for(const c of counts){
      const hit = c.item_id && byId[c.item_id];
      if(hit){ hit.count = c.count; hit.countNote = c.note; continue; }
      const bag = BAG_ORDER.includes(c.bag) ? c.bag : 'checked';
      let s = secs.find(x => x.bag === bag && x.cat === 'From outfit plan');
      if(!s){ s = {bag, cat:'From outfit plan', items:[]}; secs.push(s); }
      s.items.push({id:'of.' + slug(c.name), name:c.name, count:c.count, countNote:c.note, outfit:true});
    }
  }
  const removed = [];
  for(const s of secs){
    s.items = s.items.filter(i => { if(!i.custom && hidden[i.id]){ removed.push(i); return false; } return true; });
    s.items.forEach(i => i.done = !!checked[i.id]);
  }
  const all = secs.flatMap(s => s.items);
  return {secs:secs.filter(s => s.items.length), total:all.length, done:all.filter(i => i.done).length, removed, custom:pk.custom || []};
}
function packWrite(t, trav, patch){
  const id = pkId(t.id, trav.id), path = 'packing/' + id;
  if(S.packing[id] || S.created.has(id)) return write(S.store.updateDoc(path, patch));
  S.created.add(id);
  return write(S.store.setDoc(path, Object.assign({tripId:t.id, travelerId:trav.id, checked:{}, hidden:{}, custom:[]}, patch)));
}

function slotOf(time){ if(!time || !/^\d{1,2}:\d{2}$/.test(time)) return 'none'; const [h,m] = time.split(':').map(Number); const s = h*2 + (m >= 30 ? 1 : 0); return s < 16 ? 'early' : s > 43 ? 'late' : s; }

  const cols = days.slice(S.weekIdx*7, S.weekIdx*7 + 7);
  const bucket = {}, used = new Set();
  cols.forEach(dd => { sortEvents(((t.days||{})[dd.key]||{}).events).forEach(e => { const s = slotOf(e.time), k = dd.key+'|'+s; (bucket[k] = bucket[k] || []).push(e); used.add(String(s)); }); });
  const rows = ['none','early']; for(let s = 16; s <= 43; s++) rows.push(s); rows.push('late');
  const showRows = rows.filter(r => typeof r !== 'number' ? used.has(String(r)) : (!S.compact || used.has(String(r))));
  const rowLabel = r => r === 'none' ? 'Anytime' : r === 'early' ? 'Early' : r === 'late' ? 'Late' : fmtTime(`${Math.floor(r/2)}:${r%2 ? '30' : '00'}`).replace(' ', ' ');
  const n = cols.length;
  let html = `<div class="sg-corner">${cols[0].date ? esc(fmtLong(cols[0].date)) : 'Day ' + cols[0].n}</div>`;
  cols.forEach(dd => { const day = (t.days||{})[dd.key] || {};
    html += `<button class="sg-head${dd.date && dd.date===today?' today':''}" data-act="goto-day" data-key="${dd.key}" aria-label="Open day ${dd.n}">
      <span class="sg-dow">${dd.date ? `${dow(dd.date)} ${fmtMD(dd.date)}` : `DAY ${dd.n}`}</span><span class="sg-loc">${esc(day.title || 'Free day')}</span>${day.dress ? `<span class="chip dress">${esc(day.dress)}</span>` : ''}</button>`; });
  showRows.forEach(r => {
    const hour = typeof r === 'number' && r % 2 === 0;
    html += `<div class="sg-time${hour ? ' hr' : ''}">${esc(rowLabel(r))}</div>`;
    cols.forEach(dd => { const evs = bucket[dd.key+'|'+r] || [];
      html += `<div class="sg-cell${hour ? ' hr' : ''}${dd.date && dd.date===today ? ' today' : ''}">${evs.map(e => `<button class="sg-ev ${esc(e.type||'')}${e.ph?' ph':''}" data-act="goto-day" data-key="${dd.key}" title="${esc(fmtTime(e.time)+' '+e.label)}">${typeof r === 'number' ? '' : `<span class="mono">${esc(fmtTime(e.time))}</span> `}${esc(e.label)}</button>`).join('')}</div>`; });
  });
  html += `<div class="sg-time wx">Weather</div>`;
  cols.forEach(dd => { const day = (t.days||{})[dd.key] || {}; html += `<div class="sg-cell wx">${esc(day.weather || '')}</div>`; });
  return `<div class="bar"><h2 class="sec-title">Daily schedule</h2>
      ${pages > 1 ? `<div class="formrow" style="align-items:center">
        <button class="btn small" data-act="week-prev"${S.weekIdx === 0 ? ' disabled' : ''} aria-label="Previous week">‹</button>
        <span class="mono" style="font-size:13px;font-weight:700">Days ${cols[0].n}–${cols[n-1].n} of ${days.length}</span>
        <button class="btn small" data-act="week-next"${S.weekIdx === pages-1 ? ' disabled' : ''} aria-label="Next week">›</button>
      </div>` : ''}</div>
    <div class="bar"><span class="note">Tap a day or a plan to open it in the summary.</span>
      <label class="toggle" for="compact"><input type="checkbox" id="compact" data-act="compact"${S.compact ? ' checked' : ''}> Only times with plans</label></div>
    <div class="weekwrap"><div class="sgrid" style="grid-template-columns:72px repeat(${n},minmax(118px,1fr));min-width:${72 + n*128}px">${html}</div></div>`;
}

/* ---------- packing ---------- */
function renderPacking(t){
  const travs = t.travelers || [];
  if(!travs.length) return `<div class="emptystate">${ic('suitcase','big-ic')}<h3>Who’s packing?</h3><p class="muted">Add travelers in Setup and each person gets their own checklist.</p>
    <button class="btn primary" data-act="tab" data-tab="setup">Add travelers</button></div>`;
  if(!travs.find(x => x.id === S.travelerId)){ const saved = lsGet('mctrips-trav-'+t.id); S.travelerId = travs.find(x => x.id === saved) ? saved : travs[0].id; }
  const trav = travs.find(x => x.id === S.travelerId), wr = writable();
  const L = buildList(t, trav);
  const bagsPresent = BAG_ORDER.filter(b => L.secs.some(s => s.bag === b));
  if(S.bag !== 'all' && !bagsPresent.includes(S.bag)) S.bag = 'all';
  const people = travs.map(x => { const l = buildList(t, x);
    return `<button class="person" aria-pressed="${x.id===S.travelerId}" data-act="pick-trav" data-id="${esc(x.id)}">${ring(l.done, l.total)}
      <span><span class="pn">${esc(x.name)}</span><br><span class="pk mono">${l.done}/${l.total} packed</span></span></button>`; }).join('');
  const blocks = BAG_ORDER.filter(b => S.bag==='all' || S.bag===b).map(b => {
    const secs = L.secs.filter(s => s.bag === b); if(!secs.length) return '';
    const items = secs.flatMap(s => s.items), done = items.filter(i => i.done).length;
    const cats = secs.map(s => {
      const shown = S.hidePacked ? s.items.filter(i => !i.done) : s.items;
      if(!shown.length) return '';
      return `<section class="cat"><h4><span>${esc(s.cat)}</span><span class="mono">${s.items.filter(i=>i.done).length}/${s.items.length}</span></h4>
        ${shown.map(i => { const cid = 'chk-' + slug(i.id) + '-' + i.id.length;
          return `<div class="item${i.done?' done':''}"><label for="${cid}"><input type="checkbox" id="${cid}" data-act="check" data-id="${esc(i.id)}"${i.done?' checked':''}${wr?'':' disabled'}><span class="nm">${esc(i.name)}${i.count ? `<span class="qty" title="${esc(i.countNote || 'From the outfit plan')}">pack ${i.count}</span>` : ''}${i.custom?'<span class="mine">ADDED</span>':''}</span></label>
          ${wr ? `<button class="x" data-act="${i.custom?'del-custom':'hide'}" data-id="${esc(i.id)}" aria-label="Remove ${esc(i.name)} from ${esc(trav.name)}’s list" title="Remove from this list">×</button>` : ''}</div>`; }).join('')}
      </section>`; }).join('');
    return `<div class="bagblock" style="--bagc:var(--bag-${b})"><div class="bagtag"><span class="tagshape">${ic(BAG_ICON[b])}${BAGS[b].label}</span><span class="cnt">${done}/${items.length}</span></div>
      ${cats ? `<div class="cats">${cats}</div>` : `<p class="note">Everything in this bag is packed.</p>`}</div>`;
  }).join('');
  const catOptions = BAG_ORDER.map(b => `<optgroup label="${BAGS[b].label}">${[...new Set(L.secs.filter(s=>s.bag===b).map(s=>s.cat).concat(['My extras']))].map(c => `<option value="${esc(b+'::'+c)}">${esc(c)}</option>`).join('')}</optgroup>`).join('');
  const confirmReset = S.confirm === 'reset-'+trav.id;
  return `<div class="people">${people}</div>
    <div class="bar">
      <div class="filters" role="group" aria-label="Show bag">
        <button class="fchip" aria-pressed="${S.bag==='all'}" data-act="bag" data-bag="all">All bags</button>
        ${bagsPresent.map(b => `<button class="fchip" aria-pressed="${S.bag===b}" data-act="bag" data-bag="${b}">${ic(BAG_ICON[b])}${BAGS[b].short}</button>`).join('')}
      </div>
      <label class="toggle" for="hidePacked"><input type="checkbox" id="hidePacked" data-act="hide-packed"${S.hidePacked?' checked':''}> Hide packed</label>
    </div>
    ${Array.isArray(pkOf(t, trav).counts) && pkOf(t, trav).counts.length ? `<p class="note" style="margin:0"><span class="qty" style="margin:0 4px 0 0">pack #</span>numbers come from ${esc(trav.name)}’s outfit plan.${pkOf(t, trav).countsStale ? ' Outfits changed since they were counted; update them on the Outfits tab.' : ''}</p>` : ''}
    ${blocks || '<p class="note">Nothing on this list yet.</p>'}
    ${wr ? `<div class="panel">
      <h3>${ic('plus')}Add to ${esc(trav.name)}’s list</h3>
      <form class="formrow" data-form="add-item">
        <div class="field" style="flex:2 1 200px"><label for="addName">Item</label><input id="addName" data-keep placeholder="e.g. Glow sticks" autocomplete="off"></div>
        <div class="field"><label for="addCat">Goes in</label><select id="addCat" data-keep>${catOptions}</select></div>
        <button class="btn primary" type="submit">Add</button>
      </form>
      <div class="bar">
        ${L.removed.length ? `<span class="note">${plural(L.removed.length,'item')} removed from this list · <button class="linkbtn" data-act="restore">Put them back</button></span>` : '<span class="note">Tap × to drop items that don’t apply to this person.</span>'}
        ${confirmReset ? `<span class="formrow"><span class="note">Uncheck all ${L.done} items?</span><button class="btn small danger" data-act="reset-yes">Uncheck all</button><button class="btn small ghost" data-act="cancel">Keep</button></span>`
          : (L.done ? `<button class="btn small ghost" data-act="reset">Start over (repack for home)</button>` : '')}
      </div></div>` : ''}`;
}

/* ---------- setup ---------- */
function renderSetup(t){

  if(!S.setup || S.setup.id !== t.id){
    const tg = t.tags || {};
    S.setup = {id:t.id, cruise:!!tg.cruise, intl:!!tg.intl, disney:!!tg.disney, convention:!!tg.convention, lake:!!tg.lake,

    </div>

      <div class="field"><label for="tStart">First day</label><input type="date" id="tStart" data-keep value="${esc(t.start)}"${dis}></div>
      <div class="field"><label for="tNights">Nights</label><input type="number" min="0" max="60" id="tNights" data-keep value="${clampNights(t.nights)}"${dis}></div>
      <div class="field" style="flex:2 1 220px"><label for="tParty">Traveling with</label><input id="tParty" data-keep value="${esc(t.party)}" placeholder="Other families or friends"${dis}></div>
    </div>
    <div class="flab">Trip type (sets which packing items show up)</div>
    ${choice('set-tag','cruise',CH.cruise[0],CH.cruise[1],s.cruise)}
    ${choice('set-tag','intl',CH.intl[0],CH.intl[1],s.intl)}
    ${choice('set-tag','disney',CH.disney[0],CH.disney[1],s.disney)}
    <div class="checks">${ADDONS.map(x => `<label for="ta-${x.k}"><input type="checkbox" id="ta-${x.k}" data-act="set-addon" data-k="${x.k}"${s[x.k]?' checked':''}${dis}> ${x.label}</label>`).join('')}</div>
    <div style="display:flex;flex-direction:column;gap:8px"><div class="flab">Travelers</div>${rows}
      ${wr ? `<div><button type="button" class="btn small" data-act="trav-add">+ Add traveler</button></div>` : ''}</div>
    ${e.trip ? `<p class="err">${esc(e.trip)}</p>` : ''}
    ${wr ? `<div><button class="btn primary" type="submit">Save changes</button></div>` : ''}
  </form>
  <section class="panel">
    <h3>${ic('link')}Share & back up</h3>
    <p class="note" style="margin:0">Trips are saved on this phone. Send this trip as a link: tapping it opens the trip in the app. Send a new link after you change plans; their packing checkmarks stay.</p>
    <div class="formrow">
      <button type="button" class="btn small primary" data-act="export-trip">${ic('link')}Send this trip</button>
      <button type="button" class="btn small" data-act="share-app">${ic('suitcase')}Send the app</button>
      <button type="button" class="btn small" data-act="export-all">Back up all trips</button>
      <label class="btn small" for="importFile" style="cursor:pointer">Open a backup file</label>
    </div>

  </section>
  ${wr ? `<section class="panel">
    <h3>${ic('copy')}Make a copy</h3>
    <p class="note" style="margin:0">Copies the whole trip, every day’s plans included, as a separate trip. Change what you need, like the travelers or a few plans, then use Send this trip. Packing checkmarks aren’t copied.</p>
    <div><button type="button" class="btn small" data-act="dup-trip">Make a copy of this trip</button></div>
  </section>
  <section class="panel">

      : `<button class="btn small danger" data-act="del-trip">Delete trip</button>`}</div>

/* ---------- render ---------- */
function render(){
  const app = document.getElementById('app');
  const kept = {};
  app.querySelectorAll('[data-keep]').forEach(el => {
    // Keep only what the person changed, so saved values can still refresh the form.
    if(el.type === 'checkbox'){ if(el.checked !== el.defaultChecked) kept[el.id] = el.checked; }
    else if(el.tagName === 'SELECT'){ const d = [...el.options].find(o => o.defaultSelected); if(!d || el.value !== d.value) kept[el.id] = el.value; }
    else if(el.value !== el.defaultValue) kept[el.id] = el.value;
  });
  const keepKey = S.view + '|' + S.tripId + '|' + S.tab;
  const active = document.activeElement && document.activeElement.id;
  const sx = window.scrollX, sy = window.scrollY;

  let html = '';
  if(S.linkBanner) html += `<div class="banner" style="display:flex;flex-direction:column;gap:8px">
      <b>${esc(S.linkBanner.name)} is in the app.</b>
      <span>To keep it on your home screen: tap <b>Copy trip link</b>, then Share → <b>Add to Home Screen</b>. Open the app from the new icon and paste the link into “Someone sent you a trip?”</span>
      <div class="formrow"><button type="button" class="btn small primary" data-act="copy-link">Copy trip link</button><button type="button" class="btn small ghost" data-act="hide-banner">Done</button></div>
    </div>`;
  const t = trip();
  if(!S.loaded) html += `<div class="emptystate"><h2>Loading…</h2></div>`;
  else if(S.view === 'new' || !t){
    html += renderBuilder();
  } else {
    html += renderHeader(t) + renderTabs();
    html += `<main role="tabpanel" data-tab="${S.tab}" aria-labelledby="tab-${S.tab}" style="display:flex;flex-direction:column;gap:14px">${
      S.tab==='schedule' ? renderSchedule(t) : S.tab==='outfits' ? renderOutfits(t) : S.tab==='packing' ? renderPacking(t) : S.tab==='setup' ? renderSetup(t) : renderSummary(t)}</main>`;
  }
  app.innerHTML = html;
  if(render.key === keepKey) for(const [id,v] of Object.entries(kept)){ const el = document.getElementById(id); if(el){ if(el.type==='checkbox') el.checked = v; else el.value = v; } }
  render.key = keepKey;
  if(active){ const el = document.getElementById(active); if(el) el.focus({preventScroll:true}); }
  if(S.scrollTo){ const el = document.getElementById('day-'+S.scrollTo); S.scrollTo = null; if(el) el.scrollIntoView({block:'start'}); }
  else window.scrollTo(sx, sy);
}

/* ---------- sheet (edit day / event) ---------- */
function closeSheet(){ S.imp = null; S.ofi = null; S.ofEdit = null; S.ofCode = null; document.getElementById('sheetroot').innerHTML = ''; }
function dayName(t, key){ const dd = dayList(t).find(d => d.key === key); return dd && dd.date ? `${dow(dd.date)} ${fmtLong(dd.date)}` : `Day ${key}`; }
function openSheet(kind, key, evId){
  const t = trip(); if(!t) return;
  const day = (t.days||{})[key] || {};
  const ev = evId ? (day.events||[]).find(e => e.id === evId) : null;
  const val = (x, f) => x && !x.ph ? x[f] : '';
  let body;
  if(kind === 'day'){
    body = `<h3>${esc(dayName(t, key))}</h3>
      <div class="field"><label for="sTitle">Day title</label><input id="sTitle" value="${esc(day.title)}" placeholder="Where you are or what’s happening"></div>
      <div class="formrow">
        <div class="field"><label for="sWeather">Weather</label><input id="sWeather" value="${esc(day.weather)}" placeholder="72–82°F"></div>
        <div class="field"><label for="sDress">Dinner dress code</label><input id="sDress" list="dressList" value="${esc(day.dress)}" placeholder="Casual"><datalist id="dressList">${DRESS.map(d=>`<option value="${d}">`).join('')}</datalist></div>
      </div>`;
  } else {
    body = `<h3>${ev ? 'Edit' : 'Add to'} ${esc(dayName(t, key))}</h3>
      <div class="formrow">
        <div class="field"><label for="sTime">Time</label><input type="time" id="sTime" value="${esc(ev ? ev.time : '')}"></div>
        <div class="field"><label for="sType">Kind</label><select id="sType">${EVENT_TYPES.map(([k,l]) => `<option value="${k}"${(ev?ev.type:'activity')===k?' selected':''}>${l}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label for="sLabel">What</label><input id="sLabel" value="${esc(val(ev,'label'))}" placeholder="${esc(ev && ev.ph ? ev.label : 'What’s happening')}"></div>
      <div class="field"><label for="sNotes">Details</label><textarea id="sNotes" placeholder="${esc(ev && ev.ph && ev.notes ? ev.notes : 'Confirmation numbers, addresses, meeting spots')}">${esc(val(ev,'notes'))}</textarea></div>`;
  }
  document.getElementById('sheetroot').innerHTML = `<div class="scrim" data-sheet-scrim>
    <form class="sheet" role="dialog" aria-modal="true" data-sheet="${kind}" data-key="${esc(key)}" data-id="${esc(evId||'')}">
      ${body}
      <p class="err" id="sErr" hidden></p>
      <div class="bar"><div class="formrow"><button class="btn primary" type="submit">Save</button><button type="button" class="btn ghost" data-sheet-act="close">Cancel</button></div>
        ${ev ? `<span id="sDelWrap"><button type="button" class="btn small danger" data-sheet-act="del">Delete</button></span>` : ''}</div>
    </form></div>`;
  const first = document.querySelector('.sheet input:not([type=time])') || document.querySelector('.sheet input'); if(first) first.focus();
}
document.getElementById('sheetroot').addEventListener('click', e => {
  if(e.target.matches('[data-sheet-scrim]')) return closeSheet();
  const a = e.target.closest('[data-sheet-act]'); if(!a) return;
  const form = a.closest('form');
  if(a.dataset.sheetAct === 'close') return closeSheet();
  if(a.dataset.sheetAct === 'del'){ document.getElementById('sDelWrap').innerHTML = `<span class="note">Delete this?</span> <button type="button" class="btn small danger" data-sheet-act="del-yes">Delete</button>`; return; }
  if(a.dataset.sheetAct === 'del-yes'){
    const t = trip(), key = form.dataset.key, day = (t.days||{})[key] || {};
    const events = (day.events||[]).filter(x => x.id !== form.dataset.id);
    write(S.store.updateDoc('trips/'+t.id, {days:{[key]:{events}}})).then(() => toast('Deleted')).catch(()=>{});
    closeSheet();
  }
});
document.getElementById('sheetroot').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, t = trip(), key = f.dataset.key, kind = f.dataset.sheet;
  const v = id => (document.getElementById(id)?.value || '').trim();
  let patch;
  if(kind === 'day') patch = {title:v('sTitle'), weather:v('sWeather'), dress:v('sDress')};
  else {
    const day = (t.days||{})[key] || {}, events = clone(day.events || []);
    const old = events.find(x => x.id === f.dataset.id);
    const label = v('sLabel') || (old && old.ph ? old.label : '');
    if(!label){ const er = document.getElementById('sErr'); er.textContent = 'Add a short description of what’s happening.'; er.hidden = false; return; }
    const item = {id:f.dataset.id || ('e'+rid()), time:v('sTime'), type:v('sType'), label, notes:v('sNotes') || (old && old.ph && !v('sLabel') ? old.notes : '')};
    const i = events.findIndex(x => x.id === item.id); if(i >= 0) events[i] = item; else events.push(item);
    patch = {events};
  }
  write(S.store.updateDoc('trips/'+t.id, {days:{[key]:patch}})).then(() => toast('Saved')).catch(()=>{});
  closeSheet();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && document.querySelector('.scrim')) closeSheet();
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); }
});

/* ---------- actions ---------- */
function selectTrip(id){
  if(S.tripId === id) return;
  S.tripId = id; S.packing = {}; S.created = new Set(); S.setup = null; S.confirm = null; S.formErr = {}; S.weekIdx = null;
  if(id) lsSet('mctrips-trip', id);
  if(S.packUnsub){ try { S.packUnsub(); } catch(e){} S.packUnsub = null; }
  if(id) S.packUnsub = S.store.watchPacking(id, o => { S.packing = o; render(); }, () => {});
}
function defaultTrip(){
  const ids = Object.keys(S.trips); if(!ids.length) return null;
  const saved = lsGet('mctrips-trip'); if(saved && S.trips[saved]) return saved;
  const today = todayISO();
  const ongoing = ids.find(id => { const d = dayList(S.trips[id]); return d[0].date && d[0].date <= today && d[d.length-1].date >= today; }); if(ongoing) return ongoing;
  const upcoming = ids.filter(id => validDate(S.trips[id].start) && S.trips[id].start > today).sort((a,b) => S.trips[a].start.localeCompare(S.trips[b].start)); if(upcoming.length) return upcoming[0];
  return ids.sort((a,b) => (S.trips[b].createdAt||0) - (S.trips[a].createdAt||0))[0];
}
function readTravRows(){
  return [...document.querySelectorAll('[data-trav]')].map(r => ({id:r.dataset.trav, name:(document.getElementById('tn-'+r.dataset.trav).value||'').trim(), kind:document.getElementById('tk-'+r.dataset.trav).value}));
}
function buildTrip(){
  const w = S.wiz;
  const nights = clampNights(w.nights);
  if(w.start && !validDate(w.start)){ S.formErr = {wiz:'That first day isn’t a valid date.'}; render(); return; }
  if(!w.adults.length && !w.kids.length){ S.formErr = {wiz:'Add at least one traveler.'}; render(); return; }
  const travelers = w.adults.map((p,i) => ({id:p.id, name:p.name.trim() || `Adult ${i+1}`, kind:'adult'}))
    .concat(w.kids.map((p,i) => ({id:p.id, name:p.name.trim() || `Kid ${i+1}`, kind:'kid'})));
  const tags = {cruise:w.cruise, intl:w.intl, disney:w.disney, convention:w.convention, lake:w.lake};
  const name = w.name.trim() || autoName(w);
  const id = slug(name).slice(0,30) + '-' + rid();
  const body = {name, destination:w.dest.trim(), start:w.start || '', nights, tags, travelers, party:'', days:genDays({...tags, nights}), createdAt:Date.now()};
  S.formErr = {};
  write(S.store.setDoc('trips/'+id, body)).then(() => {
    selectTrip(id); S.view = 'trip'; S.tab = 'summary'; S.wiz = newWiz(); render(); window.scrollTo(0,0); toast('Trip created');
  }).catch(()=>{});
}

const app = document.getElementById('app');
app.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if(!a || a.tagName === 'INPUT' || a.tagName === 'SELECT') return;
  const t = trip(), act = a.dataset.act, w = S.wiz;
  // builder
  if(act === 'wiz-set'){ w[a.dataset.k] = a.dataset.v === '1'; render(); return; }
  if(act === 'wiz-nights'){ w.nights = clampNights(w.nights + Number(a.dataset.d)); render(); return; }

/* ---------- add from confirmation (Claude via /api/extract) ---------- */
function openImport(){ S.imp = {stage:'input', text:'', file:null, fileName:'', error:'', needCode:!lsGet('mctrips-passcode')}; renderImport(); }
function closeImport(){ S.imp = null; document.getElementById('sheetroot').innerHTML = ''; }
function readFileB64(blob){ return new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = bad; r.readAsDataURL(blob); }); }
async function shrinkImage(file){
  let src;
  try { src = await createImageBitmap(file); }
  catch(e){ src = await new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, k = Math.min(1, 2000 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w*k); c.height = Math.round(h*k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
  return {mediaType:'image/jpeg', data: await readFileB64(blob)};
}
async function filePayload(file){
  if(file.type === 'application/pdf' || /\.pdf$/i.test(file.name)){
    if(file.size > 3 * 1024 * 1024) throw {msg:'That PDF is over 3 MB. Try a screenshot of the confirmation instead.'};
    return {mediaType:'application/pdf', data: await readFileB64(file)};
  }
  if(file.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|webp|gif)$/i.test(file.name)) return shrinkImage(file);
  throw {msg:'Choose a photo, screenshot or PDF.'};
}
const IMP_ERRORS = {

  not_configured:'The app isn’t connected to Claude yet. Add ANTHROPIC_API_KEY and FAMILY_PASSCODE in the Vercel project settings, then redeploy.',

async function runImport(){
  const t = trip(), I = S.imp; if(!t || !I) return;
  I.text = (document.getElementById('impText')?.value || '').trim();
  const codeEl = document.getElementById('impCode');
  if(codeEl){ const c = codeEl.value.trim(); if(!c){ I.error = 'Enter the family passcode.'; return renderImport(); } lsSet('mctrips-passcode', c); }
  if(!I.text && !I.file){ I.error = IMP_ERRORS.empty; return renderImport(); }
  I.error = ''; I.stage = 'loading'; renderImport();
  try {
    const payload = {text:I.text, trip:{start:t.start||'', nights:clampNights(t.nights), ...(t.tags||{})}};
    if(I.file) payload.file = await filePayload(I.file);
    const r = await fetch('api/extract', {method:'POST', headers:{'content-type':'application/json', 'x-family-passcode': lsGet('mctrips-passcode') || ''}, body:JSON.stringify(payload)});
    let data = {}; try { data = await r.json(); } catch(e){}
    if(!S.imp) return;
    if(!r.ok){
      if(r.status === 401){ lsSet('mctrips-passcode', ''); I.needCode = true; }
      const code = data.error || (r.status === 404 ? 'not_configured' : r.status === 413 ? 'too_big' : r.status === 504 ? 'timeout' : r.status >= 500 ? 'server_error' : 'claude_error');
      I.error = (IMP_ERRORS[code] || IMP_ERRORS.claude_error) + (code === 'claude_error' && data.detail ? ` (Claude said: ${data.detail})` : '');
      I.stage = 'input'; return renderImport();
    }
    I.needCode = false;
    I.result = data; buildReview(t); I.stage = 'review'; renderImport();
  } catch(e){
    if(!S.imp) return;
    I.error = e && e.msg ? e.msg : (navigator.onLine === false ? 'You’re offline. Connect and try again.' : IMP_ERRORS.claude_unreachable);
    I.stage = 'input'; renderImport();
  }
}
function buildReview(t){
  const I = S.imp, res = I.result || {}, total = clampNights(t.nights) + 1;
  let start = validDate(t.start) ? t.start : null; I.newStart = null;
  const dated = (res.items||[]).map(i => i.date).concat((res.day_titles||[]).map(d => d.date)).filter(validDate).sort();
  if(!start && dated.length){ start = dated[0]; I.newStart = start; }
  const dayOf = (date, day) => validDate(date) && start ? daysBetween(start, date) + 1 : (day > 0 ? day : 1);
  I.rows = (res.items||[]).map((it, i) => { const n = dayOf(it.date, it.day); return {...it, k:'i'+i, n, on: n >= 1 && n <= total}; })
    .sort((a,b) => a.n - b.n || (a.time||'99:99').localeCompare(b.time||'99:99'));
  I.titles = (res.day_titles||[]).map((d, i) => { const n = dayOf(d.date, d.day); return {...d, k:'t'+i, n, on: n >= 1 && n <= total}; });
  I.outside = I.rows.concat(I.titles).filter(r => r.n < 1 || r.n > total).length;
}

}

function applyImport(){
  const t = trip(), I = S.imp; if(!t || !I) return;
  const total = clampNights(t.nights) + 1, days = clone(t.days || {}), used = new Set();
  const dayObj = n => days[String(n)] || (days[String(n)] = {title:'', weather:'', dress:'', events:[]});
  let added = 0, skipped = 0;
  for(const r of I.rows){
    if(!r.on) continue;
    if(r.n < 1 || r.n > total){ skipped++; continue; }
    const d = dayObj(r.n); d.events = d.events || [];
    const ev = {id:'e'+rid(), time:r.time, type:r.type, label:r.label, notes:r.notes};
    const i = ['flight','hotel','ship'].includes(r.type) ? d.events.findIndex(e => e.ph && e.type === r.type && !used.has(e.id)) : -1;
    if(i >= 0){ used.add(ev.id); d.events.splice(i, 1, ev); } else d.events.push(ev);
    used.add(ev.id); added++;
  }
  for(const r of I.titles){
    if(!r.on) continue;
    if(r.n < 1 || r.n > total){ skipped++; continue; }
    dayObj(r.n).title = r.title; added++;
  }
  const patch = {days};
  if(I.newStart) patch.start = I.newStart;
  write(S.store.updateDoc('trips/'+t.id, patch)).then(() => toast(`Added ${plural(added,'item')}${skipped ? ` · ${skipped} outside the trip skipped` : ''}`)).catch(()=>{});
  closeImport();
}

const OF_FIELDS = [['daytime','Daytime'],['evening','Evening'],['shoes','Shoes'],['foundations','Foundations']];
const OF_HINTS = {daytime:'Navy sweatsuit · tank top', evening:'Formal dress · cardigan', shoes:'Gold sandals', foundations:'Garments, slips, bras, socks'};

function currentTrav(t){

async function runOfPaste(){

/* ---------- share, backup, restore ---------- */
async function saveFile(name, obj, shareTitle){
  const text = JSON.stringify(obj);
  const file = new File([text], name, {type:'application/json'});
  try {
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:shareTitle}); return; }
  } catch(e){ if(e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function readStore(){ try { return JSON.parse(lsGet('mctrips-local-v2')) || {trips:{}, packing:{}}; } catch(e){ return {trips:{}, packing:{}}; } }
const b64u = bytes => { let s = ''; for(let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u = str => { str = str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length % 4) str += '='; const bin = atob(str); return Uint8Array.from(bin, c => c.charCodeAt(0)); };
async function packData(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream !== 'undefined'){
    try { const st = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return 'z.' + b64u(new Uint8Array(await new Response(st).arrayBuffer())); } catch(e){}
  }
  return 'j.' + b64u(raw);
}
async function unpackData(code){
  const kind = code.slice(0, 1), body = code.slice(2);
  let bytes = unb64u(body);
  if(kind === 'z'){ const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')); bytes = new Uint8Array(await new Response(st).arrayBuffer()); }
  else if(kind !== 'j') throw new Error('bad');
  return JSON.parse(new TextDecoder().decode(bytes));
}
const linkCode = text => { const m = String(text || '').match(/#trip=([zj]\.[A-Za-z0-9_-]+)/); return m ? m[1] : (/^[zj]\.[A-Za-z0-9_-]{20,}$/.test(String(text||'').trim()) ? String(text).trim() : null); };
function fingerprint(str){ let h = 5381; for(let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + str.length; }
const isStandalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch(e){ return false; } };
async function tripLink(t){
  const code = await packData({app:'mctrips', kind:'trip', version:1, trips:{[t.id]:S.trips[t.id]}});
  return location.origin + location.pathname + '#trip=' + code;
}
async function copyText(text){

async function importData(data, how){
  if(!data || data.app !== 'mctrips' || !data.trips || typeof data.trips !== 'object'){ toast(how === 'link' ? 'That link isn’t a trip link.' : 'That file isn’t a trip file.'); return null; }
  const ids = Object.keys(data.trips).filter(id => /^[A-Za-z0-9_\-.~:@+]+$/.test(id) && data.trips[id] && typeof data.trips[id] === 'object');
  if(!ids.length){ toast('No trips found in that ' + (how === 'link' ? 'link.' : 'file.')); return null; }
  for(const id of ids){ const t = data.trips[id]; t.days = t.days || {}; t.travelers = Array.isArray(t.travelers) ? t.travelers : []; await S.store.setDoc('trips/'+id, t); }
  if(data.kind === 'backup' && data.packing && typeof data.packing === 'object'){
    for(const [pid, p] of Object.entries(data.packing)) if(p && typeof p === 'object' && /^[A-Za-z0-9_\-.~:@+]+$/.test(pid)) await S.store.setDoc('packing/'+pid, p);
  }
  S.view = 'trip'; S.tripId = null; selectTrip(ids[0]); S.tab = 'summary'; render(); window.scrollTo(0,0);
  toast(ids.length === 1 ? `Opened ${data.trips[ids[0]].name || 'trip'}` : `Restored ${plural(ids.length,'trip')}`);
  return data.trips[ids[0]];
}
async function openLink(code, fromUrl){
  let data;
  try { data = await unpackData(code); } catch(e){ toast('That link is incomplete. Ask for it to be sent again.'); return; }
  const fp = fingerprint(code);
  let seen = []; try { seen = JSON.parse(lsGet('mctrips-links') || '[]'); } catch(e){}
  if(fromUrl && seen.includes(fp)){ const id = data && data.trips && Object.keys(data.trips)[0]; if(id && S.trips[id]){ selectTrip(id); S.view = 'trip'; render(); } return; }
  const t = await importData(data, 'link'); if(!t) return;
  lsSet('mctrips-links', JSON.stringify(seen.concat(fp).slice(-30)));
  if(fromUrl && !isStandalone() && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){ S.linkBanner = {name:t.name || 'This trip', url:location.href}; render(); }
}
function exportAll(){
  const d = readStore(), n = Object.keys(d.trips||{}).length;
  saveFile(`trips-backup-${todayISO()}.json`, {app:'mctrips', kind:'backup', version:1, trips:d.trips||{}, packing:d.packing||{}}, 'Trips backup')
    .then(() => toast(`${plural(n,'trip')} in the backup`));
}
document.getElementById('importFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if(!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch(err){ toast('That file isn’t a trip file.'); return; }
  importData(data, 'file');
});
window.addEventListener('hashchange', () => { const c = linkCode(location.hash); if(c) openLink(c, true); });

/* ---------- boot ---------- */
(function boot(){
  S.store = localStore();
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  let first = true;
  S.store.watchTrips(o => {
    S.trips = o; S.loaded = true;
    if(!S.trips[S.tripId]) selectTrip(defaultTrip());
    render();
    if(first){ first = false; const c = linkCode(location.hash); if(c) openLink(c, true); }
  });
  render();
  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
